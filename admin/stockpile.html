<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>備蓄品管理 管理者画面 | レジリエンスラボ</title>
<style>
:root {
  --bg: #f5f3f0;
  --surface: #ffffff;
  --border: #e5e0db;
  --accent: #8b1a2e;
  --accent-light: #b04060;
  --text: #1a1a1a;
  --muted: #888888;
  --red: #dc2626;
  --green: #16a34a;
  --radius: 8px;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); font-family: 'Hiragino Kaku Gothic ProN','Yu Gothic UI',sans-serif; color: var(--text); min-height: 100vh; }

/* ログイン */
.login-wrap { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
.login-card { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); padding: 40px 36px; width: 100%; max-width: 380px; text-align: center; }
.login-icon { font-size: 40px; margin-bottom: 12px; }
.login-title { font-size: 20px; font-weight: 700; color: var(--accent); margin-bottom: 4px; }
.login-sub { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
.login-input { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 15px; outline: none; margin-bottom: 12px; }
.login-input:focus { border-color: var(--accent); }
.login-btn { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); font-size: 15px; font-weight: 700; cursor: pointer; }
.login-btn:hover { background: var(--accent-light); }
.login-error { color: var(--red); font-size: 13px; margin-top: 8px; display: none; }

/* メイン */
.main-wrap { display: none; max-width: 900px; margin: 0 auto; padding: 24px 16px; }
.header { background: var(--accent); color: #fff; border-radius: 10px; padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
.header h1 { font-size: 18px; font-weight: 700; }
.header-sub { font-size: 12px; opacity: 0.8; margin-top: 2px; }
.logout-btn { background: rgba(255,255,255,0.2); border: none; color: #fff; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; }
.logout-btn:hover { background: rgba(255,255,255,0.3); }

/* 追加フォーム */
.add-card { background: var(--surface); border-radius: 10px; padding: 24px; box-shadow: var(--shadow); margin-bottom: 24px; }
.add-card h2 { font-size: 15px; font-weight: 700; color: var(--accent); margin-bottom: 16px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.form-input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 14px; outline: none; }
.form-input:focus { border-color: var(--accent); }
.add-btn { margin-top: 12px; padding: 10px 24px; background: var(--accent); color: #fff; border: none; border-radius: var(--radius); font-size: 14px; font-weight: 700; cursor: pointer; }
.add-btn:hover { background: var(--accent-light); }
.form-hint { font-size: 11px; color: var(--muted); margin-top: 4px; }

/* 会社一覧 */
.list-card { background: var(--surface); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
.list-header { padding: 16px 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
.list-header h2 { font-size: 15px; font-weight: 700; }
.count-badge { background: var(--accent); color: #fff; border-radius: 20px; padding: 2px 10px; font-size: 12px; }
table { width: 100%; border-collapse: collapse; }
th { padding: 10px 16px; text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; background: #fafafa; border-bottom: 1px solid var(--border); }
td { padding: 14px 16px; font-size: 14px; border-bottom: 1px solid var(--border); }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #fafafa; }
.url-link { color: var(--accent); text-decoration: none; font-size: 13px; }
.url-link:hover { text-decoration: underline; }
.copy-btn { background: none; border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; font-size: 12px; cursor: pointer; color: var(--muted); margin-left: 6px; }
.copy-btn:hover { border-color: var(--accent); color: var(--accent); }
.delete-btn { background: none; border: 1px solid #fecaca; border-radius: 4px; padding: 4px 10px; font-size: 12px; cursor: pointer; color: var(--red); }
.delete-btn:hover { background: #fef2f2; }
.empty-msg { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }

/* トースト */
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: #1a1a1a; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 14px; opacity: 0; transition: all 0.3s; pointer-events: none; z-index: 9999; white-space: nowrap; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.success { background: var(--green); }
.toast.error { background: var(--red); }

@media (max-width: 600px) {
  .form-grid { grid-template-columns: 1fr; }
  td, th { padding: 10px 12px; }
}
</style>
</head>
<body>

<!-- ログイン画面 -->
<div class="login-wrap" id="login-screen">
  <div class="login-card">
    <div class="login-icon">🛡️</div>
    <div class="login-title">管理者ログイン</div>
    <div class="login-sub">レジリエンスラボ 備蓄品管理システム</div>
    <input class="login-input" type="password" id="login-password" placeholder="管理者パスワードを入力" autocomplete="current-password">
    <button class="login-btn" id="login-btn">ログイン</button>
    <div class="login-error" id="login-error">パスワードが違います</div>
  </div>
</div>

<!-- 管理画面 -->
<div class="main-wrap" id="main-screen">
  <div class="header">
    <div>
      <h1>🏢 備蓄品管理 — 管理者画面</h1>
      <div class="header-sub">株式会社レジリエンスラボ</div>
    </div>
    <button class="logout-btn" id="logout-btn">ログアウト</button>
  </div>

  <!-- 会社追加 -->
  <div class="add-card">
    <h2>＋ 新規会社を追加</h2>
    <div class="form-grid">
      <div class="form-group">
        <label>会社名 <span style="color:var(--red)">*</span></label>
        <input class="form-input" id="add-name" placeholder="例：株式会社〇〇">
      </div>
      <div class="form-group">
        <label>会社コード（URL用）<span style="color:var(--red)">*</span></label>
        <input class="form-input" id="add-code" placeholder="例：abc-company">
        <div class="form-hint">半角英数字・ハイフンのみ</div>
      </div>
      <div class="form-group">
        <label>パスワード <span style="color:var(--red)">*</span></label>
        <input class="form-input" id="add-password" placeholder="例：resilab-xxxx">
      </div>
    </div>
    <button class="add-btn" id="add-btn">追加する</button>
  </div>

  <!-- 会社一覧 -->
  <div class="list-card">
    <div class="list-header">
      <h2>登録済み会社一覧</h2>
      <span class="count-badge" id="company-count">0社</span>
    </div>
    <div id="company-list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const BASE = window.location.origin;
let adminToken = sessionStorage.getItem('admin_token') || '';

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${adminToken}`,
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: 'エラー' }));
    throw new Error(err.error || 'APIエラー');
  }
  return res.json();
}

function showToast(msg, type = '') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = `toast show ${type}`;
  setTimeout(() => { t.className = 'toast'; }, 3000);
}

// ─ ログイン ──────────────────────────────────────
async function tryLogin() {
  const pw = document.getElementById('login-password').value;
  const err = document.getElementById('login-error');
  err.style.display = 'none';
  try {
    const json = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw }),
    }).then(r => r.ok ? r.json() : Promise.reject());
    adminToken = json.token;
    sessionStorage.setItem('admin_token', adminToken);
    showMain();
  } catch {
    err.style.display = 'block';
  }
}

document.getElementById('login-btn').addEventListener('click', tryLogin);
document.getElementById('login-password').addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });

document.getElementById('logout-btn').addEventListener('click', () => {
  sessionStorage.removeItem('admin_token');
  adminToken = '';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('main-screen').style.display = 'none';
  document.getElementById('login-password').value = '';
});

// ─ 起動時チェック ────────────────────────────────
(async () => {
  if (adminToken) {
    try {
      await api('GET', '/api/admin/companies');
      showMain();
    } catch {
      sessionStorage.removeItem('admin_token');
      adminToken = '';
    }
  }
})();

async function showMain() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'block';
  await loadCompanies();
}

// ─ 会社一覧 ──────────────────────────────────────
let companies = [];

async function loadCompanies() {
  try {
    companies = await api('GET', '/api/admin/companies');
    renderList();
  } catch (err) {
    showToast(err.message, 'error');
  }
}

function renderList() {
  document.getElementById('company-count').textContent = `${companies.length}社`;
  const el = document.getElementById('company-list');

  if (companies.length === 0) {
    el.innerHTML = '<div class="empty-msg">まだ会社が登録されていません</div>';
    return;
  }

  const url = (code) => `${BASE}/stockpile/${code}`;
  el.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>会社名</th>
          <th>会社コード</th>
          <th>URL（お客様に共有）</th>
          <th>登録日</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody>
        ${companies.map(c => `
          <tr>
            <td><strong>${esc(c.name)}</strong></td>
            <td><code style="background:#f0f0f0;padding:2px 6px;border-radius:4px;font-size:12px">${esc(c.code)}</code></td>
            <td>
              <a class="url-link" href="${url(c.code)}" target="_blank">/stockpile/${esc(c.code)}</a>
              <button class="copy-btn" onclick="copyUrl('${url(c.code)}')">コピー</button>
            </td>
            <td style="color:var(--muted)">${c.created || '—'}</td>
            <td>
              <button class="delete-btn" onclick="deleteCompany('${esc(c.code)}', '${esc(c.name)}')">削除</button>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function copyUrl(url) {
  navigator.clipboard.writeText(url).then(() => showToast('URLをコピーしました', 'success'));
}

// ─ 会社追加 ──────────────────────────────────────
document.getElementById('add-btn').addEventListener('click', async () => {
  const name = document.getElementById('add-name').value.trim();
  const code = document.getElementById('add-code').value.trim().toLowerCase();
  const password = document.getElementById('add-password').value.trim();

  if (!name || !code || !password) {
    showToast('すべての項目を入力してください', 'error'); return;
  }
  if (!/^[a-z0-9-]+$/.test(code)) {
    showToast('会社コードは半角英数字とハイフンのみ使用可能です', 'error'); return;
  }

  try {
    await api('POST', '/api/admin/companies', { name, code, password });
    document.getElementById('add-name').value = '';
    document.getElementById('add-code').value = '';
    document.getElementById('add-password').value = '';
    showToast(`「${name}」を追加しました`, 'success');
    await loadCompanies();
  } catch (err) {
    showToast(err.message, 'error');
  }
});

// ─ 会社削除 ──────────────────────────────────────
async function deleteCompany(code, name) {
  if (!confirm(`「${name}」を削除しますか？\nデータはすべて失われます。`)) return;
  try {
    await api('DELETE', '/api/admin/companies', { code });
    showToast(`「${name}」を削除しました`);
    await loadCompanies();
  } catch (err) {
    showToast(err.message, 'error');
  }
}
</script>
</body>
</html>
