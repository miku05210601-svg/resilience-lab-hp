<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>備蓄品管理 | レジリエンスラボ</title>
<style>
:root {
  --bg: #f5f3f0;
  --surface: #ffffff;
  --surface2: #f8f6f4;
  --border: #e5e0db;
  --accent: #8b1a2e;
  --accent-light: #b04060;
  --accent-tint: rgba(139,26,46,0.07);
  --text: #1a1a1a;
  --text2: #3d3d3d;
  --muted: #888888;
  --red: #dc2626;
  --yellow: #d97706;
  --green: #16a34a;
  --red-bg: #fef2f2;
  --yellow-bg: #fffbeb;
  --green-bg: #f0fdf4;
  --radius: 8px;
  --shadow: 0 2px 8px rgba(0,0,0,0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Hiragino Kaku Gothic ProN','Yu Gothic UI','Segoe UI',sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
}

/* ─ ログイン画面 ─ */
#login-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.login-card {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 48px 40px;
  width: 360px;
  text-align: center;
}
.login-logo {
  font-size: 32px;
  margin-bottom: 8px;
}
.login-title {
  font-size: 20px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 4px;
}
.login-sub {
  color: var(--muted);
  font-size: 12px;
  margin-bottom: 32px;
}
.login-form input {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  font-size: 15px;
  margin-bottom: 12px;
  outline: none;
  transition: border-color .2s;
}
.login-form input:focus { border-color: var(--accent); }
.login-form button {
  width: 100%;
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  padding: 13px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: background .2s;
}
.login-form button:hover { background: var(--accent-light); }
.login-error {
  color: var(--red);
  font-size: 13px;
  margin-top: 8px;
  display: none;
}

/* ─ メイン画面 ─ */
#main-screen { display: none; }

.app-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  height: 56px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
}
.app-header-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--accent);
  white-space: nowrap;
}
.header-spacer { flex: 1; }
.header-filter {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--muted);
}
.header-filter select {
  border: 1.5px solid var(--border);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 13px;
  background: var(--surface);
  cursor: pointer;
}
.btn-icon {
  background: none;
  border: 1.5px solid var(--border);
  border-radius: 6px;
  padding: 7px 14px;
  font-size: 13px;
  cursor: pointer;
  color: var(--text2);
  transition: border-color .2s, background .2s;
  white-space: nowrap;
}
.btn-icon:hover { border-color: var(--accent); background: var(--accent-tint); color: var(--accent); }
.btn-logout {
  background: none;
  border: none;
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
  padding: 6px 8px;
}
.btn-logout:hover { color: var(--red); }

.container { max-width: 1280px; margin: 0 auto; padding: 24px 24px; }

/* ─ ダッシュボード ─ */
.dashboard {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}
.dash-card {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 20px 24px;
  border-left: 4px solid transparent;
  box-shadow: var(--shadow);
  cursor: pointer;
  transition: transform .15s;
}
.dash-card:hover { transform: translateY(-1px); }
.dash-card.expired { border-left-color: var(--red); background: var(--red-bg); }
.dash-card.warning { border-left-color: var(--yellow); background: var(--yellow-bg); }
.dash-card.ok { border-left-color: var(--green); background: var(--green-bg); }
.dash-num { font-size: 36px; font-weight: 800; line-height: 1; }
.dash-card.expired .dash-num { color: var(--red); }
.dash-card.warning .dash-num { color: var(--yellow); }
.dash-card.ok .dash-num { color: var(--green); }
.dash-label { font-size: 13px; color: var(--muted); margin-top: 4px; }

/* ─ ツールバー ─ */
.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.btn-primary {
  background: var(--accent);
  color: #fff;
  border: none;
  border-radius: var(--radius);
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background .2s;
  white-space: nowrap;
}
.btn-primary:hover { background: var(--accent-light); }
.btn-secondary {
  background: var(--surface);
  color: var(--text2);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 8px 16px;
  font-size: 13px;
  cursor: pointer;
  transition: border-color .2s, background .2s;
  white-space: nowrap;
}
.btn-secondary:hover { border-color: var(--accent); background: var(--accent-tint); color: var(--accent); }
.toolbar-spacer { flex: 1; }

/* ─ テーブル ─ */
.table-wrap {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow-x: auto;
}
table { width: 100%; border-collapse: collapse; }
thead tr { background: var(--surface2); }
th {
  padding: 12px 14px;
  text-align: left;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  letter-spacing: .5px;
  text-transform: uppercase;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}
th:hover { color: var(--accent); }
td {
  padding: 12px 14px;
  border-top: 1px solid var(--border);
  font-size: 13px;
  color: var(--text2);
  vertical-align: middle;
}
tr:hover td { background: var(--accent-tint); }
tr.row-expired td { background: #fff5f5; }
tr.row-warning td { background: #fffdf0; }

/* ─ ステータスバッジ ─ */
.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
}
.badge-expired { background: #fee2e2; color: var(--red); }
.badge-warning { background: #fef3c7; color: var(--yellow); }
.badge-ok { background: #dcfce7; color: var(--green); }

/* ─ 過不足 ─ */
.surplus { color: var(--green); font-weight: 600; }
.shortage { color: var(--red); font-weight: 600; }
.neutral { color: var(--muted); }

/* ─ 操作ボタン ─ */
.action-btn {
  background: none;
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 4px 10px;
  font-size: 12px;
  cursor: pointer;
  color: var(--text2);
  transition: all .15s;
  margin-right: 4px;
}
.action-btn:hover { border-color: var(--accent); color: var(--accent); }
.action-btn.del:hover { border-color: var(--red); color: var(--red); }

.empty-state {
  text-align: center;
  padding: 60px 24px;
  color: var(--muted);
}
.empty-state .empty-icon { font-size: 40px; margin-bottom: 12px; }

/* ─ モーダル共通 ─ */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
}
.modal {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: 0 8px 32px rgba(0,0,0,.16);
  width: 100%;
  max-width: 560px;
  max-height: 90vh;
  overflow-y: auto;
}
.modal-header {
  padding: 20px 24px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.modal-title { font-size: 16px; font-weight: 700; }
.modal-close {
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  color: var(--muted);
  line-height: 1;
  padding: 4px;
}
.modal-close:hover { color: var(--text); }
.modal-body { padding: 20px 24px; }
.modal-footer {
  padding: 16px 24px;
  border-top: 1px solid var(--border);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
}

/* ─ フォーム ─ */
.form-row { margin-bottom: 16px; }
.form-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 6px;
  letter-spacing: .3px;
}
.form-label .required { color: var(--red); margin-left: 2px; }
.form-input, .form-select, .form-textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: border-color .2s;
  background: var(--surface);
  color: var(--text);
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
.form-textarea { resize: vertical; min-height: 72px; }
.form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }

/* ─ 設定モーダル ─ */
.settings-section { margin-bottom: 28px; }
.settings-section-title {
  font-size: 13px;
  font-weight: 700;
  color: var(--accent);
  border-bottom: 2px solid var(--accent-tint);
  padding-bottom: 8px;
  margin-bottom: 16px;
}
.contact-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; align-items: center; }
.contact-num { font-size: 12px; font-weight: 700; color: var(--muted); text-align: center; }
.location-tags { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.location-tag {
  background: var(--accent-tint);
  color: var(--accent);
  border: 1px solid var(--accent);
  border-radius: 20px;
  padding: 4px 12px;
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.location-tag button {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--accent);
  font-size: 14px;
  line-height: 1;
  padding: 0;
}
.location-add-row { display: flex; gap: 8px; }
.location-add-row input {
  flex: 1;
  padding: 8px 12px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  font-size: 13px;
  outline: none;
}
.location-add-row input:focus { border-color: var(--accent); }

/* ─ トースト通知 ─ */
#toast {
  position: fixed;
  bottom: 24px;
  right: 24px;
  background: #1a1a1a;
  color: #fff;
  padding: 12px 20px;
  border-radius: var(--radius);
  font-size: 14px;
  opacity: 0;
  transform: translateY(8px);
  transition: opacity .25s, transform .25s;
  z-index: 9999;
  pointer-events: none;
  max-width: 320px;
}
#toast.show { opacity: 1; transform: translateY(0); }
#toast.success { background: var(--green); }
#toast.error { background: var(--red); }

/* ─ フィルター強調 ─ */
.filter-active { color: var(--accent) !important; border-color: var(--accent) !important; }

/* ─ レスポンシブ ─ */
@media (max-width: 768px) {
  .app-header { padding: 0 16px; gap: 10px; }
  .app-header-title { font-size: 14px; }
  .container { padding: 16px; }
  .dashboard { grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .dash-num { font-size: 28px; }
  .toolbar { gap: 8px; }
}
@media (max-width: 480px) {
  .dashboard { grid-template-columns: 1fr; }
  .header-filter label { display: none; }
  .form-row-2, .form-row-3 { grid-template-columns: 1fr; }
  .contact-row { grid-template-columns: 1fr; }
  table { min-width: 700px; }
}
</style>
</head>
<body>

<!-- ログイン画面 -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">🏢</div>
    <div class="login-title">備蓄品管理</div>
    <div class="login-sub">レジリエンスラボ 社内ツール</div>
    <form class="login-form" id="login-form">
      <input type="password" id="login-password" placeholder="パスワードを入力" autocomplete="current-password">
      <button type="submit">ログイン</button>
      <div class="login-error" id="login-error">パスワードが違います</div>
    </form>
  </div>
</div>

<!-- メイン画面 -->
<div id="main-screen">
  <!-- ヘッダー -->
  <header class="app-header">
    <div class="app-header-title">🏢 備蓄品管理</div>
    <div class="header-spacer"></div>
    <div class="header-filter">
      <label>拠点</label>
      <select id="location-filter">
        <option value="">全て</option>
      </select>
    </div>
    <button class="btn-icon" id="btn-settings">⚙ 設定</button>
    <button class="btn-logout" id="btn-logout">ログアウト</button>
  </header>

  <div class="container">
    <!-- ダッシュボード -->
    <div class="dashboard">
      <div class="dash-card expired" data-filter="expired">
        <div class="dash-num" id="count-expired">0</div>
        <div class="dash-label">🔴 期限切れ</div>
      </div>
      <div class="dash-card warning" data-filter="warning">
        <div class="dash-num" id="count-warning">0</div>
        <div class="dash-label">🟡 期限90日以内</div>
      </div>
      <div class="dash-card ok" data-filter="ok">
        <div class="dash-num" id="count-ok">0</div>
        <div class="dash-label">🟢 正常</div>
      </div>
    </div>

    <!-- ツールバー -->
    <div class="toolbar">
      <button class="btn-primary" id="btn-add">＋ 品目追加</button>
      <button class="btn-secondary" id="btn-export">📥 CSVエクスポート</button>
      <button class="btn-secondary" id="btn-import">📤 CSVインポート</button>
      <input type="file" id="csv-file-input" accept=".csv" style="display:none">
      <button class="btn-secondary" id="btn-send-alert">📧 アラートメール送信</button>
      <div class="toolbar-spacer"></div>
      <div style="font-size:12px;color:var(--muted)" id="item-count"></div>
    </div>

    <!-- テーブル -->
    <div class="table-wrap">
      <table id="items-table">
        <thead>
          <tr>
            <th data-sort="name">品名</th>
            <th data-sort="category">カテゴリ</th>
            <th data-sort="location">拠点</th>
            <th>1箱入数</th>
            <th>箱数</th>
            <th>バラ数</th>
            <th data-sort="stock">総数量</th>
            <th>過不足</th>
            <th data-sort="expiry">使用期限</th>
            <th>状態</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="items-tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- 品目追加・編集モーダル -->
<div class="modal-overlay" id="item-modal" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="item-modal-title">品目追加</div>
      <button class="modal-close" data-close="item-modal">×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="item-id">
      <div class="form-row">
        <label class="form-label">品名<span class="required">*</span></label>
        <input class="form-input" id="item-name" placeholder="例：ミネラルウォーター 2L">
      </div>
      <div class="form-row-2">
        <div class="form-row" style="margin-bottom:0">
          <label class="form-label">カテゴリ<span class="required">*</span></label>
          <select class="form-select" id="item-category">
            <option value="水">水</option>
            <option value="食料">食料</option>
            <option value="トイレ">トイレ</option>
            <option value="衛生">衛生</option>
            <option value="電源・照明">電源・照明</option>
            <option value="その他">その他</option>
          </select>
        </div>
        <div class="form-row" style="margin-bottom:0">
          <label class="form-label">拠点</label>
          <select class="form-select" id="item-location"></select>
        </div>
      </div>
      <div class="form-row-3" style="margin-top:16px">
        <div class="form-row" style="margin-bottom:0">
          <label class="form-label">単位</label>
          <input class="form-input" id="item-unit" placeholder="本・個・箱">
        </div>
        <div class="form-row" style="margin-bottom:0">
          <label class="form-label">1箱入数</label>
          <input class="form-input" type="number" id="item-unit-qty" min="0" placeholder="0">
        </div>
        <div class="form-row" style="margin-bottom:0">
          <label class="form-label">必要数</label>
          <input class="form-input" type="number" id="item-required" min="0" placeholder="0">
        </div>
      </div>
      <div class="form-row-3" style="margin-top:12px">
        <div class="form-row" style="margin-bottom:0">
          <label class="form-label">箱数</label>
          <input class="form-input" type="number" id="item-boxes" min="0" placeholder="0">
        </div>
        <div class="form-row" style="margin-bottom:0">
          <label class="form-label">バラ数</label>
          <input class="form-input" type="number" id="item-loose" min="0" placeholder="0">
        </div>
        <div class="form-row" style="margin-bottom:0">
          <label class="form-label">総数量（自動計算）</label>
          <input class="form-input" id="item-stock-display" readonly style="background:var(--bg-input,#f0f0f0);color:var(--accent);font-weight:700" placeholder="—">
        </div>
      </div>
      <div class="form-row" style="margin-top:16px">
        <label class="form-label">使用期限（空欄＝期限なし）</label>
        <input class="form-input" type="date" id="item-expiry">
      </div>
      <div class="form-row">
        <label class="form-label">メモ（保管場所など）</label>
        <textarea class="form-textarea" id="item-memo" placeholder="倉庫3棚、医務室など"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" data-close="item-modal">キャンセル</button>
      <button class="btn-primary" id="item-save">保存</button>
    </div>
  </div>
</div>

<!-- 設定モーダル -->
<div class="modal-overlay" id="settings-modal" style="display:none">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">⚙ 設定</div>
      <button class="modal-close" data-close="settings-modal">×</button>
    </div>
    <div class="modal-body">
      <!-- 担当者設定 -->
      <div class="settings-section">
        <div class="settings-section-title">担当者（メール通知先）</div>
        <div id="contacts-form"></div>
      </div>
      <!-- 拠点管理 -->
      <div class="settings-section">
        <div class="settings-section-title">拠点管理</div>
        <div class="location-tags" id="location-tags"></div>
        <div class="location-add-row">
          <input type="text" id="location-new-input" placeholder="新しい拠点名">
          <button class="btn-secondary" id="btn-add-location">追加</button>
        </div>
      </div>
      <!-- 警告日数 -->
      <div class="settings-section">
        <div class="settings-section-title">期限警告日数</div>
        <div style="display:flex;align-items:center;gap:10px">
          <input class="form-input" type="number" id="alert-days" style="width:100px" min="1" max="365">
          <span style="color:var(--muted);font-size:13px">日以内を⚠警告として表示</span>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" data-close="settings-modal">キャンセル</button>
      <button class="btn-primary" id="settings-save">保存</button>
    </div>
  </div>
</div>

<!-- 削除確認モーダル -->
<div class="modal-overlay" id="delete-modal" style="display:none">
  <div class="modal" style="max-width:400px">
    <div class="modal-header">
      <div class="modal-title">削除の確認</div>
      <button class="modal-close" data-close="delete-modal">×</button>
    </div>
    <div class="modal-body">
      <p style="color:var(--text2)">「<strong id="delete-item-name"></strong>」を削除しますか？この操作は元に戻せません。</p>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" data-close="delete-modal">キャンセル</button>
      <button class="btn-primary" id="delete-confirm" style="background:var(--red)">削除する</button>
    </div>
  </div>
</div>

<!-- トースト -->
<div id="toast"></div>

<script>
// ─ 状態管理 ─────────────────────────────────
// URLから会社コードを取得（/stockpile/abc-company → 'abc-company'）
const pathParts = window.location.pathname.split('/').filter(Boolean);
const companyCode = pathParts[1] || '';  // /stockpile/[code]

// 会社コードがある場合は会社別APIを使用、ない場合は旧APIを使用
const API_LOGIN  = companyCode ? `/api/stockpile/${companyCode}/login`     : '/api/stockpile/login';
const API_DATA   = companyCode ? `/api/stockpile/${companyCode}/data`       : '/api/stockpile/data';
const API_ALERT  = companyCode ? `/api/stockpile/${companyCode}/send-alert` : '/api/stockpile/send-alert';
const TOKEN_KEY  = companyCode ? `stockpile_token_${companyCode}`           : 'stockpile_token';

let token = sessionStorage.getItem(TOKEN_KEY) || '';
let data = { contacts: [], locations: ['本社'], alertDays: 90, items: [] };
let statusFilter = '';
let deleteTargetId = null;
let sortKey = 'expiry';
let sortAsc = true;

// ─ API ──────────────────────────────────────
async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${token}`,
    },
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

// ─ 初期化 ────────────────────────────────────
async function init() {
  // 会社コードがある場合、会社名をタイトルに表示
  if (companyCode) {
    document.title = `備蓄品管理 | ${companyCode}`;
  }

  if (token) {
    try {
      data = await api('GET', API_DATA);
      showMain();
    } catch {
      sessionStorage.removeItem(TOKEN_KEY);
      token = '';
      showLogin();
    }
  } else {
    showLogin();
  }
}

function showLogin() {
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('main-screen').style.display = 'none';
}

function showMain() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('main-screen').style.display = 'block';
  render();
}

// ─ ログイン ──────────────────────────────────
document.getElementById('login-form').addEventListener('submit', async e => {
  e.preventDefault();
  const pw = document.getElementById('login-password').value;
  const err = document.getElementById('login-error');
  err.style.display = 'none';
  try {
    const res = await fetch(API_LOGIN, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: pw }),
    });
    if (!res.ok) { err.style.display = 'block'; return; }
    const json = await res.json();
    token = json.token;
    sessionStorage.setItem(TOKEN_KEY, token);
    // 会社名をヘッダーに表示
    if (json.companyName) {
      document.querySelector('.login-sub').textContent = json.companyName;
    }
    data = await api('GET', API_DATA);
    showMain();
  } catch {
    err.style.display = 'block';
  }
});

// ─ ログアウト ─────────────────────────────────
document.getElementById('btn-logout').addEventListener('click', () => {
  sessionStorage.removeItem(TOKEN_KEY);
  token = '';
  location.reload();
});

// ─ ステータス判定 ─────────────────────────────
function getStatus(expiry) {
  if (!expiry) return 'ok';
  const today = new Date(); today.setHours(0,0,0,0);
  const exp = new Date(expiry);
  const diff = Math.floor((exp - today) / 86400000);
  if (diff < 0) return 'expired';
  if (diff <= (data.alertDays || 90)) return 'warning';
  return 'ok';
}

function statusLabel(s) {
  if (s === 'expired') return '<span class="badge badge-expired">🔴 期限切れ</span>';
  if (s === 'warning') return '<span class="badge badge-warning">🟡 要確認</span>';
  return '<span class="badge badge-ok">🟢 正常</span>';
}

function daysLabel(expiry) {
  if (!expiry) return '<span style="color:var(--muted)">期限なし</span>';
  const today = new Date(); today.setHours(0,0,0,0);
  const diff = Math.floor((new Date(expiry) - today) / 86400000);
  const style = diff < 0 ? 'color:var(--red)' : diff <= (data.alertDays||90) ? 'color:var(--yellow)' : 'color:var(--text2)';
  const suffix = diff < 0 ? `（${-diff}日超過）` : `（残${diff}日）`;
  return `<span style="${style}">${expiry}${suffix}</span>`;
}

// 総数量 = 1箱入数 × 箱数 + バラ数
function calcStock(item) {
  const unitQty = Number(item.unitQty) || 0;
  const boxes   = Number(item.boxes)   || 0;
  const loose   = Number(item.loose)   || 0;
  // 旧データ（stockフィールドのみ）との互換性を保つ
  if (unitQty === 0 && boxes === 0 && loose === 0 && item.stock !== undefined) {
    return Number(item.stock) || 0;
  }
  return unitQty * boxes + loose;
}

function surplusLabel(stock, required, unit) {
  if (!required && required !== 0) return '<span class="neutral">—</span>';
  const diff = (stock || 0) - (required || 0);
  if (diff >= 0) return `<span class="surplus">+${diff} 余剰</span>`;
  return `<span class="shortage">${diff} 不足</span>`;
}

// ─ レンダリング ───────────────────────────────
function render() {
  updateLocationFilter();
  updateDashboard();
  updateTable();
  document.getElementById('item-count').textContent = `全 ${data.items.length} 件`;
}

function updateLocationFilter() {
  const sel = document.getElementById('location-filter');
  const cur = sel.value;
  sel.innerHTML = '<option value="">全拠点</option>';
  (data.locations || []).forEach(loc => {
    const opt = document.createElement('option');
    opt.value = loc; opt.textContent = loc;
    if (loc === cur) opt.selected = true;
    sel.appendChild(opt);
  });
}

function updateDashboard() {
  const counts = { expired: 0, warning: 0, ok: 0 };
  data.items.forEach(item => counts[getStatus(item.expiry)]++);
  document.getElementById('count-expired').textContent = counts.expired;
  document.getElementById('count-warning').textContent = counts.warning;
  document.getElementById('count-ok').textContent = counts.ok;
}

function updateTable() {
  const locFilter = document.getElementById('location-filter').value;
  let items = data.items.filter(item => {
    if (locFilter && item.location !== locFilter) return false;
    if (statusFilter && getStatus(item.expiry) !== statusFilter) return false;
    return true;
  });

  // ソート
  items = items.slice().sort((a, b) => {
    let va = a[sortKey] || '', vb = b[sortKey] || '';
    if (sortKey === 'stock' || sortKey === 'required') {
      va = Number(va) || 0; vb = Number(vb) || 0;
    }
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ? 1 : -1;
    return 0;
  });

  const tbody = document.getElementById('items-tbody');
  if (items.length === 0) {
    tbody.innerHTML = `<tr><td colspan="8">
      <div class="empty-state">
        <div class="empty-icon">📦</div>
        <div>品目が登録されていません</div>
      </div>
    </td></tr>`;
    return;
  }

  tbody.innerHTML = items.map(item => {
    const s = getStatus(item.expiry);
    const rowClass = s === 'expired' ? 'row-expired' : s === 'warning' ? 'row-warning' : '';
    return `<tr class="${rowClass}">
      <td><strong>${esc(item.name)}</strong>${item.memo ? `<br><span style="font-size:11px;color:var(--muted)">${esc(item.memo)}</span>` : ''}</td>
      <td>${esc(item.category)}</td>
      <td>${esc(item.location || '—')}</td>
      <td style="text-align:right">${item.unitQty ?? '—'}</td>
      <td style="text-align:right">${item.boxes ?? '—'}</td>
      <td style="text-align:right">${item.loose ?? '—'}</td>
      <td style="text-align:right;font-weight:700">${calcStock(item)} ${esc(item.unit || '')}</td>
      <td>${surplusLabel(calcStock(item), item.required, item.unit)}</td>
      <td>${daysLabel(item.expiry)}</td>
      <td>${statusLabel(s)}</td>
      <td>
        <button class="action-btn" onclick="openEdit('${item.id}')">編集</button>
        <button class="action-btn del" onclick="openDelete('${item.id}')">削除</button>
      </td>
    </tr>`;
  }).join('');
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─ ダッシュボードカードフィルター ──────────────
document.querySelectorAll('.dash-card').forEach(card => {
  card.addEventListener('click', () => {
    const f = card.dataset.filter;
    statusFilter = statusFilter === f ? '' : f;
    document.querySelectorAll('.dash-card').forEach(c => c.style.outline = '');
    if (statusFilter) card.style.outline = '3px solid var(--accent)';
    updateTable();
  });
});

// ─ ロケーションフィルター ──────────────────────
document.getElementById('location-filter').addEventListener('change', updateTable);

// ─ ソート ────────────────────────────────────
document.querySelectorAll('th[data-sort]').forEach(th => {
  th.addEventListener('click', () => {
    const key = th.dataset.sort;
    if (sortKey === key) sortAsc = !sortAsc;
    else { sortKey = key; sortAsc = true; }
    updateTable();
  });
});

// ─ 品目追加・編集モーダル ────────────────────────
function openAdd() {
  document.getElementById('item-modal-title').textContent = '品目追加';
  document.getElementById('item-id').value = '';
  document.getElementById('item-name').value = '';
  document.getElementById('item-category').value = '水';
  document.getElementById('item-unit-qty').value = '';
  document.getElementById('item-boxes').value = '';
  document.getElementById('item-loose').value = '';
  document.getElementById('item-stock-display').value = '';
  document.getElementById('item-required').value = '';
  document.getElementById('item-unit').value = '';
  document.getElementById('item-expiry').value = '';
  document.getElementById('item-memo').value = '';
  updateLocationSelect();
  showModal('item-modal');
}

function openEdit(id) {
  const item = data.items.find(i => i.id === id);
  if (!item) return;
  document.getElementById('item-modal-title').textContent = '品目編集';
  document.getElementById('item-id').value = item.id;
  document.getElementById('item-name').value = item.name || '';
  document.getElementById('item-category').value = item.category || '水';
  document.getElementById('item-unit-qty').value = item.unitQty ?? '';
  document.getElementById('item-boxes').value = item.boxes ?? '';
  document.getElementById('item-loose').value = item.loose ?? '';
  document.getElementById('item-stock-display').value = calcStock(item);
  document.getElementById('item-required').value = item.required ?? '';
  document.getElementById('item-unit').value = item.unit || '';
  document.getElementById('item-expiry').value = item.expiry || '';
  document.getElementById('item-memo').value = item.memo || '';
  updateLocationSelect(item.location);
  showModal('item-modal');
}

function updateLocationSelect(selected) {
  const sel = document.getElementById('item-location');
  sel.innerHTML = '';
  (data.locations || ['本社']).forEach(loc => {
    const opt = document.createElement('option');
    opt.value = loc; opt.textContent = loc;
    if (loc === selected) opt.selected = true;
    sel.appendChild(opt);
  });
}

document.getElementById('btn-add').addEventListener('click', openAdd);

// 総数量のリアルタイム自動計算
function updateStockDisplay() {
  const unitQty = Number(document.getElementById('item-unit-qty').value) || 0;
  const boxes   = Number(document.getElementById('item-boxes').value)   || 0;
  const loose   = Number(document.getElementById('item-loose').value)   || 0;
  document.getElementById('item-stock-display').value = unitQty * boxes + loose;
}
['item-unit-qty', 'item-boxes', 'item-loose'].forEach(id => {
  document.getElementById(id).addEventListener('input', updateStockDisplay);
});

document.getElementById('item-save').addEventListener('click', async () => {
  const name = document.getElementById('item-name').value.trim();
  if (!name) { showToast('品名を入力してください', 'error'); return; }

  const id = document.getElementById('item-id').value;
  const item = {
    id: id || crypto.randomUUID(),
    name,
    category: document.getElementById('item-category').value,
    location: document.getElementById('item-location').value,
    unitQty: Number(document.getElementById('item-unit-qty').value) || 0,
    boxes:   Number(document.getElementById('item-boxes').value)   || 0,
    loose:   Number(document.getElementById('item-loose').value)   || 0,
    required: Number(document.getElementById('item-required').value) || 0,
    unit: document.getElementById('item-unit').value.trim(),
    expiry: document.getElementById('item-expiry').value,
    memo: document.getElementById('item-memo').value.trim(),
  };

  if (id) {
    const idx = data.items.findIndex(i => i.id === id);
    if (idx >= 0) data.items[idx] = item;
  } else {
    data.items.push(item);
  }

  await saveData();
  closeModal('item-modal');
  render();
  showToast(id ? '品目を更新しました' : '品目を追加しました', 'success');
});

// ─ 削除 ──────────────────────────────────────
function openDelete(id) {
  const item = data.items.find(i => i.id === id);
  if (!item) return;
  deleteTargetId = id;
  document.getElementById('delete-item-name').textContent = item.name;
  showModal('delete-modal');
}

document.getElementById('delete-confirm').addEventListener('click', async () => {
  data.items = data.items.filter(i => i.id !== deleteTargetId);
  await saveData();
  closeModal('delete-modal');
  render();
  showToast('削除しました', 'success');
});

// ─ 設定モーダル ──────────────────────────────
document.getElementById('btn-settings').addEventListener('click', () => {
  renderContactsForm();
  renderLocationTags();
  document.getElementById('alert-days').value = data.alertDays || 90;
  showModal('settings-modal');
});

function renderContactsForm() {
  const contacts = data.contacts || [];
  let html = '';
  for (let i = 0; i < 3; i++) {
    const c = contacts[i] || { name: '', email: '' };
    html += `<div class="contact-row">
      <input class="form-input" placeholder="担当者名 ${i+1}" data-ci="${i}" data-field="name" value="${esc(c.name)}">
      <input class="form-input" type="email" placeholder="メールアドレス" data-ci="${i}" data-field="email" value="${esc(c.email)}">
    </div>`;
  }
  document.getElementById('contacts-form').innerHTML = html;
}

function renderLocationTags() {
  const tags = document.getElementById('location-tags');
  tags.innerHTML = (data.locations || []).map(loc =>
    `<span class="location-tag">${esc(loc)}<button onclick="removeLocation('${esc(loc)}')">×</button></span>`
  ).join('');
}

function removeLocation(loc) {
  data.locations = (data.locations || []).filter(l => l !== loc);
  renderLocationTags();
}

document.getElementById('btn-add-location').addEventListener('click', () => {
  const input = document.getElementById('location-new-input');
  const val = input.value.trim();
  if (!val) return;
  if (data.locations.includes(val)) { showToast('既に登録されています', 'error'); return; }
  data.locations.push(val);
  input.value = '';
  renderLocationTags();
});

document.getElementById('location-new-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); document.getElementById('btn-add-location').click(); }
});

document.getElementById('settings-save').addEventListener('click', async () => {
  // 担当者収集
  const contacts = [];
  document.querySelectorAll('#contacts-form input[data-ci]').forEach(inp => {
    const i = Number(inp.dataset.ci);
    if (!contacts[i]) contacts[i] = { name: '', email: '' };
    contacts[i][inp.dataset.field] = inp.value.trim();
  });
  data.contacts = contacts.filter(c => c.name || c.email);
  data.alertDays = Number(document.getElementById('alert-days').value) || 90;

  await saveData();
  closeModal('settings-modal');
  render();
  showToast('設定を保存しました', 'success');
});

// ─ CSVエクスポート ────────────────────────────
document.getElementById('btn-export').addEventListener('click', () => {
  const headers = ['品名','カテゴリ','拠点','単位','1箱入数','箱数','バラ数','総数量','必要数','使用期限','状態','メモ'];
  const rows = data.items.map(item => {
    const s = getStatus(item.expiry);
    const stLabel = s === 'expired' ? '期限切れ' : s === 'warning' ? '要確認' : '正常';
    return [item.name, item.category, item.location, item.unit,
            item.unitQty ?? '', item.boxes ?? '', item.loose ?? '', calcStock(item),
            item.required, item.expiry, stLabel, item.memo]
      .map(v => `"${String(v ?? '').replace(/"/g, '""')}"`);
  });
  const csv = '﻿' + [headers, ...rows].map(r => r.join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `備蓄品リスト_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  showToast('CSVをエクスポートしました', 'success');
});

// ─ CSVインポート ──────────────────────────────
document.getElementById('btn-import').addEventListener('click', () => {
  document.getElementById('csv-file-input').value = '';
  document.getElementById('csv-file-input').click();
});

document.getElementById('csv-file-input').addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async (ev) => {
    try {
      // BOM除去
      let text = ev.target.result.replace(/^﻿/, '');
      const lines = text.split(/\r?\n/).filter(l => l.trim());
      if (lines.length < 2) { showToast('データが空です', 'error'); return; }

      // ヘッダー行を読んでカラム位置を判定
      const headers = parseCSVLine(lines[0]);
      const idx = {
        name:     headers.indexOf('品名'),
        category: headers.indexOf('カテゴリ'),
        location: headers.indexOf('拠点'),
        unit:     headers.indexOf('単位'),
        unitQty:  headers.indexOf('1箱入数'),
        boxes:    headers.indexOf('箱数'),
        loose:    headers.indexOf('バラ数'),
        required: headers.indexOf('必要数'),
        expiry:   headers.indexOf('使用期限'),
        memo:     headers.indexOf('メモ'),
      };

      if (idx.name === -1) {
        showToast('「品名」列が見つかりません', 'error');
        return;
      }

      const added = [];
      for (let i = 1; i < lines.length; i++) {
        const cols = parseCSVLine(lines[i]);
        if (!cols[idx.name]) continue; // 品名が空の行はスキップ

        // 使用期限：YYYY-MM-DD 形式に正規化
        let expiry = idx.expiry >= 0 ? (cols[idx.expiry] || '').trim() : '';
        if (expiry && !/^\d{4}-\d{2}-\d{2}$/.test(expiry)) {
          expiry = expiry.replace(/\//g, '-');
          if (!/^\d{4}-\d{2}-\d{2}$/.test(expiry)) expiry = '';
        }

        added.push({
          id: crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + i,
          name:     (cols[idx.name] || '').trim(),
          category: idx.category >= 0 ? (cols[idx.category] || 'その他').trim() : 'その他',
          location: idx.location >= 0 ? (cols[idx.location] || data.locations[0]).trim() : data.locations[0],
          unit:     idx.unit >= 0 ? (cols[idx.unit] || '個').trim() : '個',
          unitQty:  idx.unitQty >= 0 ? (parseInt(cols[idx.unitQty]) || 0) : 0,
          boxes:    idx.boxes >= 0 ? (parseInt(cols[idx.boxes]) || 0) : 0,
          loose:    idx.loose >= 0 ? (parseInt(cols[idx.loose]) || 0) : 0,
          required: idx.required >= 0 ? (parseInt(cols[idx.required]) || 0) : 0,
          expiry,
          memo:     idx.memo >= 0 ? (cols[idx.memo] || '').trim() : '',
        });
      }

      if (added.length === 0) { showToast('取り込める品目がありませんでした', 'error'); return; }

      // 既存データに追記して保存
      data.items = [...data.items, ...added];
      await api('POST', API_DATA, data);
      renderTable();
      renderDashboard();
      showToast(`${added.length}件の品目を取り込みました`, 'success');
    } catch (err) {
      showToast('CSVの読み込みに失敗しました: ' + err.message, 'error');
    }
  };
  reader.readAsText(file, 'UTF-8');
});

// CSV1行をパース（ダブルクォート対応）
function parseCSVLine(line) {
  const result = [];
  let cur = '';
  let inQ = false;
  for (let i = 0; i < line.length; i++) {
    const ch = line[i];
    if (inQ) {
      if (ch === '"' && line[i+1] === '"') { cur += '"'; i++; }
      else if (ch === '"') { inQ = false; }
      else { cur += ch; }
    } else {
      if (ch === '"') { inQ = true; }
      else if (ch === ',') { result.push(cur); cur = ''; }
      else { cur += ch; }
    }
  }
  result.push(cur);
  return result;
}

// ─ アラートメール送信 ──────────────────────────
document.getElementById('btn-send-alert').addEventListener('click', async () => {
  if (data.contacts.length === 0) {
    showToast('担当者が未登録です。設定から追加してください', 'error');
    return;
  }
  const alertItems = data.items.filter(item => getStatus(item.expiry) !== 'ok');
  if (alertItems.length === 0) {
    showToast('アラート対象の品目はありません', 'success');
    return;
  }
  const btn = document.getElementById('btn-send-alert');
  btn.disabled = true;
  btn.textContent = '送信中...';
  try {
    await api('POST', API_ALERT);
    showToast(`${alertItems.length}件のアラートメールを送信しました`, 'success');
  } catch (err) {
    showToast('送信に失敗しました: ' + err.message, 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '📧 アラートメール送信';
  }
});

// ─ データ保存 ─────────────────────────────────
async function saveData() {
  await api('POST', API_DATA, data);
}

// ─ モーダル制御 ──────────────────────────────
function showModal(id) { document.getElementById(id).style.display = 'flex'; }
function closeModal(id) { document.getElementById(id).style.display = 'none'; }

document.querySelectorAll('[data-close]').forEach(btn => {
  btn.addEventListener('click', () => closeModal(btn.dataset.close));
});
document.querySelectorAll('.modal-overlay').forEach(overlay => {
  overlay.addEventListener('click', e => {
    if (e.target === overlay) closeModal(overlay.id);
  });
});

// ─ トースト ──────────────────────────────────
let toastTimer;
function showToast(msg, type = '') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = type ? `show ${type}` : 'show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 3000);
}

// ─ 起動 ──────────────────────────────────────
init();
